<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jada Rinquest Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe3ea, #f5f0ff, #e8fff7);
    min-height: 100vh;
    color: #46344e;
    overflow-x: hidden;
    position: relative;
}

/* Animated background */
.animated-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.floating-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    mix-blend-mode: multiply;
    animation: floatAround 25s infinite ease-in-out;
}

.shape1 {
    width: 400px;
    height: 400px;
    background: #d4b0d0;
    top: -10%;
    left: -10%;
}

.shape2 {
    width: 350px;
    height: 350px;
    background: #b8d9d0;
    bottom: -5%;
    right: -5%;
}

.shape3 {
    width: 300px;
    height: 300px;
    background: #f5d4e8;
    top: 40%;
    left: 30%;
}

.shape4 {
    width: 250px;
    height: 250px;
    background: #ffe9ae;
    bottom: 20%;
    left: -5%;
}

.shape5 {
    width: 300px;
    height: 300px;
    background: #d8e8ff;
    top: 10%;
    right: 10%;
}

@keyframes floatAround {
    0% {
        transform: translate(0,0) scale(1) rotate(0deg);
    }
    33% {
        transform: translate(50px, 60px) scale(1.1) rotate(120deg);
    }
    66% {
        transform: translate(-30px, -40px) scale(0.9) rotate(240deg);
    }
    100% {
        transform: translate(0,0) scale(1) rotate(360deg);
    }
}

/* Main layout */
.portfolio-layout {
    display: grid;
    grid-template-columns: 420px 1fr;
    min-height: 100vh;
    max-width: 1600px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

/* Sidebar */
.sidebar-wrapper {
    padding: 40px 20px 40px 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.profile-card {
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 32px;
    padding: 35px;
    height: 100%;
    box-shadow: 0 20px 40px rgba(70, 52, 78, 0.04);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease;
}

.profile-card:hover {
    transform: translateY(-2px);
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    line-height: 1.1;
    background: linear-gradient(145deg, #3f2a47, #6a4e7a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 15px 0 5px 0;
}

.subtitle {
    color: #5f4a6b;
    font-weight: 500;
    font-size: 1.05rem;
    margin-bottom: 25px;
}

.meta-badges {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.meta-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-radius: 16px;
    font-size: 0.9rem;
    font-weight: 500;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.mb-1 { background: #ffd7e1; }
.mb-2 { background: #d8f5e4; }
.mb-3 { background: #ffe9ae; }
.mb-4 { background: #d8e8ff; }

.social-strip {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.social-strip a {
    flex: 1;
    height: 50px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 16px;
    text-decoration: none;
    color: #46344e;
    font-weight: 600;
    transition: all 0.25s ease;
}

.social-strip a:hover {
    transform: translateY(-3px);
    background: #f5d4e8;
    box-shadow: 0 10px 15px rgba(212, 176, 208, 0.3);
}

/* Main content */
.main-content {
    padding: 40px 40px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.content-card {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 32px;
    padding: 40px;
    box-shadow: 0 15px 35px rgba(70, 52, 78, 0.03);
}

.about-box {
    font-size: 1.15rem;
    line-height: 1.7;
    color: #46344e;
    font-weight: 300;
}

.section-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    margin-bottom: 25px;
    position: relative;
    display: inline-block;
}

/* Tabs */
.tab-navigation {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    background: rgba(255, 255, 255, 0.4);
    padding: 6px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.tab-btn {
    flex: 1;
    padding: 12px;
    border: none;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    color: #5f4a6b;
    cursor: pointer;
    border-radius: 14px;
    transition: all 0.25s ease;
}

.tab-btn.active {
    background: white;
    color: #46344e;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
    animation: fadeIn 0.4s ease forwards;
}

/* Grids */
.sub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.tag-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.tag-container span {
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 0.9rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.t1 { background: #ffd7e1; }
.t2 { background: #e3d8ff; }
.t3 { background: #d8f5e4; }
.t4 { background: #ffe9ae; }
.t5 { background: #d8e8ff; }

/* Timeline */
.interactive-timeline {
    position: relative;
    padding-left: 20px;
    border-left: 2px dashed rgba(212, 176, 208, 0.6);
}

.timeline-card {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 15px;
    position: relative;
    transition: all 0.25s ease;
}

.timeline-card:hover {
    background: white;
    transform: translateX(4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.03);
}

.timeline-card::before {
    content: '';
    position: absolute;
    left: -27px;
    top: 24px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #d4b0d0;
    border: 2px solid white;
}

.timeline-card .date-badge {
    float: right;
    font-size: 0.8rem;
    background: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 500;
    border: 1px solid rgba(0,0,0,0.05);
}

.timeline-card ul {
    padding-left: 18px;
    margin-top: 10px;
    font-size: 0.95rem;
}
